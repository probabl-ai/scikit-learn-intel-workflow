name: dpnp-float32

permissions: {}

on:
  workflow_dispatch:
    inputs:
      scikit_learn_ref:
        description: "scikit-learn owner and branch to test, for instance scikit-learn:main or cakedev0:doc/dpnp_xpu_support"
        required: false
        default: "scikit-learn:main"
        type: string

env:
  SKLEARN_DIR_NAME: scikit-learn-dpnp-${{ github.run_id }}-${{ github.run_attempt }}
  VENV_DIR_NAME: scikit-learn-dpnp-venv-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  dpnp-sklearn:
    name: Run dpnp scikit-learn tests
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, intel-gpu, float32-gpu]
    timeout-minutes: 90

    steps:
      - name: Show runner and Intel GPU info
        run: |
          set -euo pipefail
          uname -srmo
          python3 --version
          lscpu || true
          lscpu --extended=CPU,CORE,SOCKET,ONLINE,MAXMHZ,MINMHZ,MHZ,MODELNAME || true
          lscpu --caches || true
          sed -n 's/^/SMT active: /p' /sys/devices/system/cpu/smt/active 2>/dev/null || true
          command -v lspci && lspci -nn | grep -Ei "vga|3d|display|graphics|intel" || true
          ls -l /dev/dri || true
          command -v clinfo && clinfo || true

      - name: Clone scikit-learn
        env:
          SCIKIT_LEARN_REF: ${{ inputs.scikit_learn_ref }}
        run: |
          set -euo pipefail
          SCIKIT_LEARN_REF="${SCIKIT_LEARN_REF:-scikit-learn:main}"
          SKLEARN_REPOSITORY="https://github.com/${SCIKIT_LEARN_REF%%:*}/scikit-learn.git"
          SCIKIT_LEARN_REF="${SCIKIT_LEARN_REF#*:}"
          SKLEARN_DIR="${RUNNER_TEMP}/${SKLEARN_DIR_NAME}"
          git init "${SKLEARN_DIR}"
          git -C "${SKLEARN_DIR}" remote add origin "${SKLEARN_REPOSITORY}"
          git -C "${SKLEARN_DIR}" fetch --depth=1 origin "${SCIKIT_LEARN_REF}"
          git -C "${SKLEARN_DIR}" checkout --detach FETCH_HEAD
          git -C "${SKLEARN_DIR}" rev-parse --short HEAD

      - name: Create virtual environment
        run: |
          set -euo pipefail
          VENV_DIR="${RUNNER_TEMP}/${VENV_DIR_NAME}"
          python3 -m venv "${VENV_DIR}"
          source "${VENV_DIR}/bin/activate"
          python -m pip install --upgrade \
            pip setuptools wheel ninja pytest \
            "numpy>=2" "scipy>=1.10.0" \
            "cython>=3.1.2" "meson-python>=0.17.1"

      - name: Build and install scikit-learn from source
        run: |
          set -euo pipefail
          SKLEARN_DIR="${RUNNER_TEMP}/${SKLEARN_DIR_NAME}"
          VENV_DIR="${RUNNER_TEMP}/${VENV_DIR_NAME}"
          source "${VENV_DIR}/bin/activate"
          python -m pip install --verbose --no-build-isolation --editable "${SKLEARN_DIR}[tests]"

      - name: Install dpnp
        run: |
          set -euo pipefail
          VENV_DIR="${RUNNER_TEMP}/${VENV_DIR_NAME}"
          source "${VENV_DIR}/bin/activate"
          python -m pip install --upgrade dpnp
          python -m pip check
          python -c "import dpctl; print(dpctl.get_devices())" || true

      - name: Run dpnp tests
        run: |
          set -euo pipefail
          SKLEARN_DIR="${RUNNER_TEMP}/${SKLEARN_DIR_NAME}"
          VENV_DIR="${RUNNER_TEMP}/${VENV_DIR_NAME}"
          source "${VENV_DIR}/bin/activate"
          cd "${SKLEARN_DIR}"
          python -c "import dpnp; print(f'dpnp {dpnp.__version__}')"
          python -c "import sklearn; sklearn.show_versions()"
          SCIPY_ARRAY_API=1 pytest sklearn -k dpnp

      - name: Clean runner temp
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP:?}/${SKLEARN_DIR_NAME}" "${RUNNER_TEMP:?}/${VENV_DIR_NAME}"
