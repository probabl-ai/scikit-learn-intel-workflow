name: torch-xpu

permissions: {}

on:
  workflow_dispatch:
    inputs:
      scikit_learn_ref:
        description: "scikit-learn owner and branch to test, for instance scikit-learn:main or cakedev0:doc/dpnp_xpu_support"
        required: false
        default: "scikit-learn:main"
        type: string
      torch_xpu_build:
        description: "PyTorch XPU wheel build to install"
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - nightly

env:
  SKLEARN_DIR_NAME: scikit-learn-torch-xpu-${{ github.run_id }}-${{ github.run_attempt }}
  VENV_DIR_NAME: scikit-learn-torch-xpu-venv-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  torch-xpu-sklearn:
    name: Run torch-xpu scikit-learn tests
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, intel-gpu, float64-gpu]
    timeout-minutes: 90

    steps:
      - name: Show runner and Intel GPU info
        run: |
          set -euo pipefail
          uname -srmo
          python3 --version
          lscpu || true
          lscpu --extended=CPU,CORE,SOCKET,ONLINE,MAXMHZ,MINMHZ,MHZ,MODELNAME || true
          lscpu --caches || true
          sed -n 's/^/SMT active: /p' /sys/devices/system/cpu/smt/active 2>/dev/null || true
          command -v lspci && lspci -nn | grep -Ei "vga|3d|display|graphics|intel" || true
          ls -l /dev/dri || true
          command -v clinfo && clinfo || true

      - name: Clone scikit-learn
        env:
          SCIKIT_LEARN_REF: ${{ inputs.scikit_learn_ref }}
        run: |
          set -euo pipefail
          SCIKIT_LEARN_REF="${SCIKIT_LEARN_REF:-scikit-learn:main}"
          SKLEARN_REPOSITORY="https://github.com/${SCIKIT_LEARN_REF%%:*}/scikit-learn.git"
          SCIKIT_LEARN_REF="${SCIKIT_LEARN_REF#*:}"
          SKLEARN_DIR="${RUNNER_TEMP}/${SKLEARN_DIR_NAME}"
          git init "${SKLEARN_DIR}"
          git -C "${SKLEARN_DIR}" remote add origin "${SKLEARN_REPOSITORY}"
          git -C "${SKLEARN_DIR}" fetch --depth=1 origin "${SCIKIT_LEARN_REF}"
          git -C "${SKLEARN_DIR}" checkout --detach FETCH_HEAD
          git -C "${SKLEARN_DIR}" rev-parse --short HEAD

      - name: Create virtual environment
        run: |
          set -euo pipefail
          VENV_DIR="${RUNNER_TEMP}/${VENV_DIR_NAME}"
          python3 -m venv "${VENV_DIR}"
          source "${VENV_DIR}/bin/activate"
          python -m pip install --upgrade \
            pip setuptools wheel ninja pytest \
            "numpy>=2" "scipy>=1.10.0" \
            "cython>=3.1.2" "meson-python>=0.17.1"

      - name: Build and install scikit-learn from source
        run: |
          set -euo pipefail
          SKLEARN_DIR="${RUNNER_TEMP}/${SKLEARN_DIR_NAME}"
          VENV_DIR="${RUNNER_TEMP}/${VENV_DIR_NAME}"
          source "${VENV_DIR}/bin/activate"
          python -m pip install --verbose --no-build-isolation --editable "${SKLEARN_DIR}[tests]"

      - name: Install pytorch XPU
        env:
          TORCH_XPU_BUILD: ${{ inputs.torch_xpu_build }}
        run: |
          set -euo pipefail
          VENV_DIR="${RUNNER_TEMP}/${VENV_DIR_NAME}"
          source "${VENV_DIR}/bin/activate"
          TORCH_XPU_BUILD="${TORCH_XPU_BUILD:-stable}"
          if [[ "${TORCH_XPU_BUILD}" == "nightly" ]]; then
            python -m pip install --pre torch torchvision torchaudio --index-url https://download.pytorch.org/whl/nightly/xpu
          else
            python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/xpu
          fi
          python -m pip check
          python -c "import torch; print(torch.__version__, torch.xpu.is_available(), torch.xpu.device_count() if torch.xpu.is_available() else 0)"

      - name: Run XPU tests
        run: |
          set -euo pipefail
          SKLEARN_DIR="${RUNNER_TEMP}/${SKLEARN_DIR_NAME}"
          VENV_DIR="${RUNNER_TEMP}/${VENV_DIR_NAME}"
          source "${VENV_DIR}/bin/activate"
          cd "${SKLEARN_DIR}"
          python -c "import torch; print(torch.xpu.is_available())"
          python -c "import sklearn; sklearn.show_versions()"
          SCIPY_ARRAY_API=1 pytest sklearn -k xpu

      - name: Clean runner temp
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP:?}/${SKLEARN_DIR_NAME}" "${RUNNER_TEMP:?}/${VENV_DIR_NAME}"
