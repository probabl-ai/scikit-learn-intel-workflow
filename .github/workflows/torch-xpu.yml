name: torch-xpu

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      scikit_learn_repository:
        description: "scikit-learn repository URL to clone"
        required: false
        default: "https://github.com/scikit-learn/scikit-learn.git"
        type: string
      scikit_learn_ref:
        description: "scikit-learn branch, tag, or commit to test"
        required: false
        default: "main"
        type: string

env:
  SKLEARN_DIR_NAME: scikit-learn-torch-xpu-${{ github.run_id }}-${{ github.run_attempt }}
  VENV_DIR_NAME: scikit-learn-torch-xpu-venv-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  torch-xpu-sklearn:
    name: Run torch-xpu scikit-learn tests
    runs-on: [self-hosted, Linux, X64, intel-gpu, float64-gpu]
    timeout-minutes: 90

    steps:
      - name: Show runner and Intel GPU info
        run: |
          set -exo pipefail
          hostname
          uname -a
          whoami
          python3 --version
          command -v clinfo && clinfo || true
          ls -l /dev/dri || true

      - name: Clone scikit-learn
        env:
          SKLEARN_REPOSITORY: ${{ inputs.scikit_learn_repository }}
          SCIKIT_LEARN_REF: ${{ inputs.scikit_learn_ref }}
        run: |
          set -euxo pipefail
          SKLEARN_REPOSITORY="${SKLEARN_REPOSITORY:-https://github.com/scikit-learn/scikit-learn.git}"
          SCIKIT_LEARN_REF="${SCIKIT_LEARN_REF:-main}"
          SKLEARN_DIR="${RUNNER_TEMP}/${SKLEARN_DIR_NAME}"
          git init "${SKLEARN_DIR}"
          git -C "${SKLEARN_DIR}" remote add origin "${SKLEARN_REPOSITORY}"
          git -C "${SKLEARN_DIR}" fetch --depth=1 origin "${SCIKIT_LEARN_REF}"
          git -C "${SKLEARN_DIR}" checkout --detach FETCH_HEAD
          git -C "${SKLEARN_DIR}" rev-parse --short HEAD

      - name: Create virtual environment
        run: |
          set -euxo pipefail
          VENV_DIR="${RUNNER_TEMP}/${VENV_DIR_NAME}"
          python3 -m venv "${VENV_DIR}"
          source "${VENV_DIR}/bin/activate"
          python -m pip install --upgrade \
            pip setuptools wheel ninja pytest \
            "numpy>=2" "scipy>=1.10.0" \
            "cython>=3.1.2" "meson-python>=0.17.1"

      - name: Build and install scikit-learn from source
        run: |
          set -euxo pipefail
          SKLEARN_DIR="${RUNNER_TEMP}/${SKLEARN_DIR_NAME}"
          VENV_DIR="${RUNNER_TEMP}/${VENV_DIR_NAME}"
          source "${VENV_DIR}/bin/activate"
          python -m pip install --verbose --no-build-isolation --editable "${SKLEARN_DIR}[tests]"

      - name: Install pytorch XPU
        run: |
          set -euxo pipefail
          VENV_DIR="${RUNNER_TEMP}/${VENV_DIR_NAME}"
          source "${VENV_DIR}/bin/activate"
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/xpu
          python -m pip check

      - name: Run XPU tests
        run: |
          set -euxo pipefail
          SKLEARN_DIR="${RUNNER_TEMP}/${SKLEARN_DIR_NAME}"
          VENV_DIR="${RUNNER_TEMP}/${VENV_DIR_NAME}"
          source "${VENV_DIR}/bin/activate"
          cd "${SKLEARN_DIR}"
          python -c "import torch; print(torch.xpu.is_available())"
          python -c "import sklearn; sklearn.show_versions()"
          SCIPY_ARRAY_API=1 pytest sklearn -k xpu
