name: Hello GPU

on:
  workflow_dispatch:

jobs:
  hello-gpu:
    runs-on: [arthur-framework, intel-gpu]

    steps:
      - name: Show machine info
        run: |
          hostname
          uname -a
          whoami
          pwd

      - name: Check Python
        run: |
          python3 --version
          which python3

      - name: Check Intel GPU visibility
        run: |
          echo "Checking GPU devices..."
          ls -l /dev/dri || true
          command -v sycl-ls && sycl-ls || true
          command -v clinfo && clinfo || true
          command -v intel_gpu_top && intel_gpu_top -l || true
