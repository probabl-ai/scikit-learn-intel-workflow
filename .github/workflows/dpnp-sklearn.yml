name: dpnp scikit-learn

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      scikit_learn_ref:
        description: "scikit-learn branch, tag, or commit to test"
        required: false
        default: "main"
        type: string

env:
  SKLEARN_REPOSITORY: https://github.com/scikit-learn/scikit-learn.git

jobs:
  dpnp-sklearn:
    name: Run dpnp scikit-learn tests
    runs-on: [self-hosted, Linux, X64, intel-gpu]
    timeout-minutes: 90
    env:
      SKLEARN_DIR: ${{ runner.temp }}/scikit-learn-dpnp-${{ github.run_id }}-${{ github.run_attempt }}
      VENV_DIR: ${{ runner.temp }}/scikit-learn-dpnp-venv-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Show runner and Intel GPU info
        run: |
          set -exo pipefail
          hostname
          uname -a
          whoami
          python3 --version
          command -v clinfo && clinfo || true
          ls -l /dev/dri || true

      - name: Clone scikit-learn
        env:
          SCIKIT_LEARN_REF: ${{ inputs.scikit_learn_ref }}
        run: |
          set -euxo pipefail
          SCIKIT_LEARN_REF="${SCIKIT_LEARN_REF:-main}"
          git init "${SKLEARN_DIR}"
          git -C "${SKLEARN_DIR}" remote add origin "${SKLEARN_REPOSITORY}"
          git -C "${SKLEARN_DIR}" fetch --depth=1 origin "${SCIKIT_LEARN_REF}"
          git -C "${SKLEARN_DIR}" checkout --detach FETCH_HEAD
          git -C "${SKLEARN_DIR}" rev-parse --short HEAD

      - name: Create virtual environment
        run: |
          set -euxo pipefail
          python3 -m venv "${VENV_DIR}"
          source "${VENV_DIR}/bin/activate"
          python -m pip install --upgrade pip setuptools wheel ninja pytest

      - name: Build and install scikit-learn from source
        run: |
          set -euxo pipefail
          source "${VENV_DIR}/bin/activate"
          python -m pip install --verbose "${SKLEARN_DIR}[tests]"

      - name: Install dpnp
        run: |
          set -euxo pipefail
          source "${VENV_DIR}/bin/activate"
          python -m pip install --upgrade dpnp
          python -m pip check

      - name: Run dpnp tests
        working-directory: ${{ env.SKLEARN_DIR }}
        run: |
          set -euxo pipefail
          source "${VENV_DIR}/bin/activate"
          python -c "import dpnp; print(f'dpnp {dpnp.__version__}')"
          python -c "import sklearn; sklearn.show_versions()"
          SCIPY_ARRAY_API=1 pytest sklearn -k dpnp
