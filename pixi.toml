[workspace]
name = "scikit-learn-intel-workflow"
channels = ["conda-forge"]
platforms = ["linux-64"]
channel-priority = "strict"

[dependencies]
python = "3.12.*"
pip = "*"
setuptools = "<82"
wheel = "*"
ninja = "*"
pytest = ">=7.1.2"
pytest-cov = ">=2.9.0"
numpy = ">=2"
scipy = ">=1.10.0"
cython = ">=3.1.2"
meson-python = ">=0.17.1"
joblib = ">=1.3.0"
threadpoolctl = ">=3.2.0"

[feature.dpnp.pypi-dependencies]
dpnp = "*"

[feature.torch-xpu.pypi-dependencies]
torch = { version = "==2.12.0+xpu", index = "https://download.pytorch.org/whl/xpu" }

[environments]
dpnp = ["dpnp"]
torch-xpu = ["torch-xpu"]
